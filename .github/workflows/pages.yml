name: Deploy dashboard to Pages

on:
  push:
    branches: [main]          # rebuild whenever code/analysis changes
  schedule:
    - cron: "0 13 * * *"      # daily ~9am ET: refresh with latest Sleeper/FC data
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python3 build.py --dry-run

      - name: Prepare site
        run: |
          mkdir -p _site
          cp output/dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
